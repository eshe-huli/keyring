[package]
name = "keyring"
version = "0.1.0"
edition = "2024"
description = "Distributed agent mesh runtime"
license = "Apache-2.0"
repository = "https://github.com/eshe-huli/keyring"

[[bin]]
name = "keyring"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Identity & crypto
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
blake3 = "1"
rand = "0.8"

# Storage
redb = "2"

# CRDTs
automerge = "0.5"

# Networking (QUIC)
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

# gRPC
tonic = "0.12"
prost = "0.13"

# Actor model
ractor = { version = "0.12", optional = true }

# WASM plugins (heavy compile — optional until needed)
wasmtime = { version = "27", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async traits
async-trait = "0.1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
bytes = "1"
dashmap = "6"
hex = "0.4"
directories = "6"

[features]
default = []
plugins = ["wasmtime"]
actors = ["ractor"]
full = ["plugins", "actors"]

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = true
strip = true
